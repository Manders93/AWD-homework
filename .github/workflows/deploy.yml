name: Deploy AWD Homework to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Assignment 1
        working-directory: Assignment-1
        run: npm ci

      - name: Build Assignment 1
        working-directory: Assignment-1
        run: npm run build

      - name: Install Assignment 2
        working-directory: Assignment-2
        run: npm ci

      - name: Build Assignment 2
        working-directory: Assignment-2
        run: npm run build

      - name: Install Assignment 3
        working-directory: Assignment-3
        run: npm ci

      - name: Build Assignment 3
        working-directory: Assignment-3
        run: npm run build

      - name: Install Assignment 4
        working-directory: Assignment-4
        run: npm ci

      - name: Build Assignment 4
        working-directory: Assignment-4
        run: npm run build

      - name: Install Assignment 5
        working-directory: Assignment-5
        run: npm ci

      - name: Build Assignment 5
        working-directory: Assignment-5
        run: npm run build

      - name: Prepare website
        run: |
          mkdir -p public/Assignment-1
          mkdir -p public/Assignment-2
          mkdir -p public/Assignment-3
          mkdir -p public/Assignment-4
          mkdir -p public/Assignment-5

          cp index.html public/

          cp -r Assignment-1/dist/* public/Assignment-1/
          cp -r Assignment-2/dist/* public/Assignment-2/
          cp -r Assignment-3/dist/* public/Assignment-3/
          cp -r Assignment-4/dist/* public/Assignment-4/
          cp -r Assignment-5/dist/* public/Assignment-5/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
